[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-dexpi-aas"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydexpi==1.2.0",
    "python-pptx",
    "streamlit>=1.55",  # st.components.v2: the clickable map
    "numpy",
    "pandas",
    "pillow",
    "openpyxl",
    "cairosvg",  # check sheet "after" drawing; needs the cairo library (macOS: brew install cairo)
    "networkx",
    # AAS export (aas/export.py): 2.0.x writes AAS metamodel 3.0, what IDTA 02012-1-0 and the
    # IDTA's own test engine use; 2.1+ writes 3.1, which that test engine rejects
    "basyx-python-sdk>=2.0.1,<2.1",
    "aas-core3.0",  # metamodel verification of the AAS 3.0 / 3.1 output
    "aas-core3.1",
]

[project.optional-dependencies]
dev = ["pytest", "aas-test-engines"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
