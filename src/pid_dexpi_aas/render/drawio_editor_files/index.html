<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2933; }
  #wrap { display: flex; height: 100%; }
  iframe { border: 0; flex: 1; height: 100%; display: block; min-width: 0; }
  #panel { width: 330px; flex: none; border-left: 1px solid #d9dde3; overflow-y: auto; padding: 14px 16px 24px; box-sizing: border-box; background: #fafbfc; }
  #panel h3 { margin: 0 0 2px; font-size: 15px; }
  #panel .sub { color: #5f6b7a; margin-bottom: 12px; }
  #panel label.f { display: block; margin: 10px 0 3px; font-weight: 600; font-size: 12px; color: #3e4a59; }
  #panel input[type=text], #panel input[type=number], #panel select { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #c8ced6; border-radius: 4px; font: inherit; background: #fff; }
  #panel .row { display: flex; gap: 6px; }
  #panel .row > * { flex: 1; }
  #panel .seg { display: flex; border: 1px solid #c8ced6; border-radius: 4px; overflow: hidden; }
  #panel .seg button { flex: 1; border: 0; background: #fff; padding: 5px 4px; font: inherit; cursor: pointer; border-right: 1px solid #c8ced6; }
  #panel .seg button:last-child { border-right: 0; }
  #panel .seg button.on { background: #ff4b4b; color: #fff; }
  #panel .check { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
  #panel .hint { color: #5f6b7a; font-size: 12px; margin-top: 3px; }
  #panel details { margin-top: 14px; border-top: 1px solid #e3e6ea; padding-top: 8px; }
  #panel summary { cursor: pointer; font-weight: 600; }
  #panel .guide { border: 1px solid #c8ced6; border-radius: 6px; padding: 8px 10px; margin-bottom: 14px; background: #fff; }
  #panel .guide b { font-size: 13px; }
  #panel .guide .prog { color: #5f6b7a; font-size: 12px; margin: 2px 0 6px; }
  #panel .act { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  #panel .act button { margin-top: 0 !important; }
  #panel button.ok { background: #e6f4ea !important; border-color: #6cbf84 !important; font-weight: 600; }
  #panel button.no { background: #fdecec !important; border-color: #e08b8b !important; }
  #panel .foot { margin-top: 18px; color: #5f6b7a; font-size: 12px; border-top: 1px solid #e3e6ea; padding-top: 10px; }
</style>
</head>
<body>
<div id="wrap"><iframe id="ed" title="draw.io editor"></iframe><aside id="panel"></aside></div>
<script>
// The app's Editor tab: draw.io (webapp/, served by this component) in embed mode, plus the
// DEXPI panel. draw.io's JSON protocol: it asks for its configuration, says "init" (we send
// the drawing), and Save / Ctrl+S gives "save" with the XML, which goes back to the app.
// Same origin as the editor, so the panel works on its graph directly (window W below).
// Each cell's DEXPI details are data fields on it (see pid_dexpi_aas/drawio/editor_data.py).
const ed = document.getElementById("ed");
const panel = document.getElementById("panel");
const toApp = (type, extra) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra || {}), "*");
const toEditor = (msg) => ed.contentWindow && ed.contentWindow.postMessage(JSON.stringify(msg), "*");
let args = null, ready = false, shown = null, saved = null, pendingSync = null;
// every drawing this editor sent to the app (the last few): the app answers each save with a
// rerun that hands one of them back - sometimes an older one (edits made meanwhile), or
// wrapped in a file header (draw.io mode). Reloading it would reset the view and undo those
// edits, so the editor's own drawings are never loaded back.
const sentXml = [];
function ours(xml) {
  // (an empty save would be "in" every drawing: only real drawings count)
  return !!xml && sentXml.some((x) => x && x.length > 200 && (xml === x || xml.includes(x)));
}
let keepView = null;  // the zoom and position to put back after a (real) reload
// Saving on its own: a few seconds after a change (not while typing a label), so the app -
// the checks, the DEXPI file, the exports - always has the drawing as it is. Changes the
// app itself sends (patches) are not edits and never trigger it.
let applying = false, dirty = false, autosaveTimer = null, autosave = true, lastFocus = "";
function scheduleSave() {
  if (applying || !autosave) return;
  dirty = true;
  if (autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(function tick() {
    if (!dirty) return;
    if (graph.isEditing() || (ui.editor && ui.editor.graph.isMouseDown)) { autosaveTimer = setTimeout(tick, 1500); return; }
    autosaveTimer = null;
    ui.actions.get("save").funct();
  }, 3000);
}
// the app asks for a cell to be shown (a problem found by its build check): select it, once
function focusRequest() {
  const f = args.focus || "";
  if (!f || f === lastFocus) return;
  lastFocus = f;
  const cell = graph.getModel().getCell(f.split("|")[0]);
  if (cell) { if (guide) { guide = null; graph.refresh(); } focusCell(cell); render(); }
}
// The spec sheet (uploaded in the app): Save, and the app puts its values on these items
// Full screen: the whole editor - the drawing and this panel - fills the screen (Esc leaves)
function fullScreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
document.addEventListener("fullscreenchange", () => {
  if (graph) setTimeout(() => {
    // draw.io reopens its styling panel when there is room for it: keep it closed (see trim)
    if (ui.isFormatPanelVisible && ui.isFormatPanelVisible()) ui.toggleFormatPanel(false);
    graph.sizeDidChange && graph.sizeDidChange();
    render();
  }, 150);
});
function syncSpecs(ids) {
  pendingSync = ids;
  ui.actions.get("save").funct();
}
let ui = null, graph = null, W = null, lastPatch = null, schema = null;

fetch("schema.json").then((r) => r.json()).then((s) => { schema = s; render(); }).catch(() => { schema = {}; });

window.addEventListener("message", (e) => {
  if (e.source === ed.contentWindow) {
    let m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.event === "configure") {
      toEditor({ action: "configure", config: args.config || {} });
    } else if (m.event === "init") {
      ready = true;
      shown = args.xml || "";
      lastPatch = null;
      toEditor({ action: "load", xml: shown, title: args.title || "" });
      hookEditor();
    } else if (m.event === "load") {
      if (graph && keepView) {
        graph.view.scaleAndTranslate(keepView.scale, keepView.x, keepView.y);
        keepView = null;
      } else if (graph) {
        // a new drawing: the whole of it in view (an editor opened fresh started on an empty corner)
        setTimeout(() => { const fit = ui && ui.actions.get("fitWindow"); if (fit) fit.funct(); else graph.fit(); }, 150);
      }
      if (graph) { applying = true; try { applyPatch(true); } finally { applying = false; } render(); setTimeout(marks, 200); }
      setTimeout(closeLayers, 300);
    } else if (m.event === "save") {
      saved = m.xml;
      sentXml.push(m.xml);
      if (sentXml.length > 20) sentXml.shift();
      toEditor({ action: "status", message: "Sent to the app", modified: false });
      // ids: the rows this drawing was showing - only those can have been deleted here;
      // routes: every line as draw.io draws it (its right angles are worked out while drawing,
      // not stored in the file) - the app's map follows the same path
      // sync: "all" or [ids] - the app then fills these items' specifications from the spec sheet
      toApp("streamlit:setComponentValue", { value: { xml: m.xml, t: Date.now(), ids: Object.keys(lastPatch || {}),
                                                      routes: drawnRoutes(), sync: pendingSync }, dataType: "json" });
      pendingSync = null;
      dirty = false;
      if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
      render();
    }
    return;
  }
  const d = e.data;
  if (!d || d.type !== "streamlit:render") return;
  const first = args === null;
  args = d.args;
  if (first) {
    ed.src = "webapp/index.html?" + args.params;
    toApp("streamlit:setFrameHeight", { height: args.height });
  } else if (ready && args.xml !== shown && args.xml !== saved && !ours(args.xml)) {
    shown = args.xml || "";
    lastPatch = null;
    if (graph) keepView = { scale: graph.view.scale, x: graph.view.translate.x, y: graph.view.translate.y };
    toEditor({ action: "load", xml: shown, title: args.title || "" });
  } else if (graph) {
    applying = true;
    try { applyPatch(false); } finally { applying = false; }
    render();
  }
  if (graph) focusRequest();
});
toApp("streamlit:componentReady", { apiVersion: 1 });

// ------------------------------------------------------------------ editor set-up ---
function hookEditor() {
  const w = ed.contentWindow;
  if (!w.Draw || !w.Draw.loadPlugin) { setTimeout(hookEditor, 200); return; }
  w.Draw.loadPlugin((u) => {
    ui = u; graph = u.editor.graph; W = w;
    // draw.io remembers each browser's last library choice and ignores our default once one is
    // saved (a browser that used the editor before General was added kept only P&ID): reset it
    const libs = "general;pid";
    if (w.mxSettings && w.mxSettings.getLibraries && w.mxSettings.getLibraries() !== libs) {
      w.mxSettings.setLibraries(libs);
      w.mxSettings.save();
      u.sidebar.showEntries(libs);
    }
    trim();
    hookGroups();
    hookTagLabels();
    const fs = ui.actions.get("fullscreen");   // draw.io's own full-screen button: the whole editor
    if (fs) fs.funct = fullScreen;
    hookNewShapes();   // a library symbol dropped on a drawing or on a picture: typed at once
    hookGuide();
    graph.getSelectionModel().addListener(W.mxEvent.CHANGE, () => render());
    graph.getModel().addListener(W.mxEvent.CHANGE, () => { render(); scheduleSave(); setTimeout(marks, 0); });
    applyPatch(true);
    render();
    setTimeout(closeLayers, 300);
  });
}

// What a P&ID needs from draw.io, and nothing that would break the conversion: no other
// files or pages, no raw XML / style / data editing, images or links. Groups (Ctrl+G) are
// allowed: a group is one item (several shapes drawing one piece of equipment).
function trim() {
  const doc = ed.contentDocument;
  for (const name of ["editDiagram", "editStyle", "editData", "insertImage", "insertLink",
       "editLink", "editTooltip", "pageSetup", "print", "plugins", "tags", "insertTemplate", "fromText",
       "formatSql", "import", "editConnectionPoints", "insertPage", "duplicatePage", "removePage",
       "fromTemplate", "insertMermaid", "insertPlantUml", "insertLayout", "outline", "editShape",
       "copyAsImage", "createShape", "addWaypoint", "insertRectangle", "insertEllipse", "insertRhombus",
       "insertText", "insertNote", "insertTable", "editImage", "crop", "makeCopy", "share", "publishLink"]) {
    const a = ui.actions.get(name);
    if (a) { a.setEnabled(false); a.isEnabled = () => false; a.visible = false; }
  }
  if (ui.formatWindow == null && ui.toggleFormatPanel && ui.isFormatPanelVisible && ui.isFormatPanelVisible()) {
    ui.toggleFormatPanel(false);
  }
  const hide = () => {
    doc.querySelectorAll(".geMenubar a.geItem, .geMenubarContainer a.geItem").forEach((el) => {
      if (["File", "Extras", "Help"].includes(el.textContent.trim())) el.style.display = "none";
    });
  };
  hide(); setTimeout(hide, 500);
  // a line can end ON another line (a tee): draw.io then attaches it to that line
  graph.setConnectableEdges(true);
  // draw.io's tool for each part of a P&ID: tags and stream ends are text, pipes and signal lines are lines
  const sb = ui.sidebar;
  const picture = args.mode === "picture";
  // a picture review: new lines and boxes look like the ones drawn from the review
  const width = picture ? (Object.values(graph.getModel().cells).map((c) => graph.getModel().isEdge(c) && styleOf(c, "strokeWidth"))
    .find((w) => w) || "3") : "1";
  const pipe = picture ? `edgeStyle=none;rounded=0;html=1;strokeColor=#d9480f;strokeWidth=${width};endArrow=classic;startArrow=none;`
                       : "endArrow=classic;html=1;edgeStyle=orthogonalEdgeStyle;rounded=0;";
  const signal = picture ? pipe.replace("#d9480f", "#2456c4") + "dashed=1;" : pipe + "dashed=1;";
  if (picture) {  // lines drawn from a shape's hover arrows too
    const st = Object.fromEntries(pipe.split(";").filter(Boolean).map((kv) => kv.split("=")));
    graph.defaultEdgeStyle = Object.assign({}, st);
    graph.currentEdgeStyle = Object.assign({}, st);
  }
  const extra = picture ? [  // a picture: draw a box around a symbol the model missed
    sb.createVertexTemplateEntry("rounded=0;whiteSpace=wrap;html=1;fillColor=none;strokeColor=#d9480f;" +
      `strokeWidth=${width};fontColor=#d9480f;fontStyle=1;verticalLabelPosition=top;verticalAlign=bottom;`, 80, 80, "TAG",
      "Item box - put it around a missed symbol, then set its type and tag"),
  ] : [];
  sb.addPaletteFunctions("dexpi", "Lines and labels", true, [
    ...extra,
    sb.createVertexTemplateEntry("text;html=1;align=center;verticalAlign=middle;", 60, 24, "TAG 101", "Tag (put it next to the item)"),
    sb.createVertexTemplateEntry("text;html=1;align=center;verticalAlign=middle;strokeColor=#000000;rounded=0;", 80, 30, "Product", "Stream end (feed / product - a pipe ends on it)"),
    sb.createEdgeTemplateEntry(pipe, 120, 0, "", "Process pipe"),
    sb.createEdgeTemplateEntry(signal, 120, 0, "", "Signal line (dashed)"),
  ]);
  const pal = sb.palettes && sb.palettes["dexpi"];
  // no scratchpad (a personal shape store) and no other libraries ("More Shapes"); of draw.io's
  // general shapes only "General" (Misc and Advanced: images, links, containers, ...)
  const strip = () => {
    sb.container.querySelectorAll(".geTitle").forEach((t) => {
      if (["Scratchpad", "Misc", "Advanced"].includes(t.textContent.trim())) {
        t.style.display = "none";
        if (t.nextElementSibling) t.nextElementSibling.style.display = "none";
      }
    });
    doc.querySelectorAll("button, a").forEach((b) => {
      if (b.textContent.trim().endsWith("More Shapes")) b.style.display = "none";
    });
  };
  strip(); setTimeout(strip, 500);
  new W.MutationObserver(strip).observe(sb.container, { childList: true, subtree: true });  // draw.io re-adds the scratchpad
  if (pal && pal[0] && pal[0].parentNode) {
    const parent = pal[0].parentNode;
    const firstPalette = [...parent.children].find((n) => n.classList.contains("geTitle"));
    for (const n of pal) parent.insertBefore(n, firstPalette || null);
  }
  // one page per drawing: the converter reads the first page only
  const css = doc.createElement("style");
  css.textContent = ".geTabContainer { display: none !important; }";
  doc.head.appendChild(css);
  if (ui.tabContainer) { ui.tabContainer.style.display = "none"; ui.tabContainerHeight = 0; ui.refresh && ui.refresh(); }
}

// draw.io opens its Layers window for a drawing with layers (a picture under the items):
// the picture layer is locked anyway, so keep the canvas clear
function closeLayers(tries) {
  const lw = ui && ((ui.actions && ui.actions.layersWindow) || ui.layersWindow);
  if (lw && lw.window && lw.window.isVisible()) lw.window.setVisible(false);
  if ((tries || 0) < 10) setTimeout(() => closeLayers((tries || 0) + 1), 300);  // it may open a moment later
}

// Every line's path as drawn, in drawing coordinates (the picture's pixels): the view's
// points, from end to end, undone of the zoom and scroll.
function drawnRoutes() {
  const out = {};
  if (!graph) return out;
  const m = graph.getModel(), v = graph.view, sc = v.scale, tr = v.translate;
  for (const c of Object.values(m.cells)) {
    if (!m.isEdge(c)) continue;
    const st = v.getState(c);
    if (st && st.absolutePoints && st.absolutePoints.length >= 2) {
      out[c.id] = st.absolutePoints.filter(Boolean).map((q) => [q.x / sc - tr.x, q.y / sc - tr.y]);
    }
  }
  return out;
}

// ------------------------------------------------------------------- cell data ---
const val = (cell, name) => (cell && cell.value && typeof cell.value === "object" && cell.value.getAttribute)
  ? cell.value.getAttribute(name) : null;
const labelOf = (cell) => {
  if (!cell) return "";
  const v = cell.value && typeof cell.value === "object" ? cell.value.getAttribute("label") : cell.value;
  // a library instrument's label is a table - "TI" over "101": read as "TI 101"
  const t = document.createElement("div"); t.innerHTML = (v || "").replace(/</g, " <");
  return t.textContent.replace(/\s+/g, " ").trim();
};
// read from the cell's own style (the view's computed style lags behind a change)
const styleOf = (cell, key) => {
  const m = new RegExp("(?:^|;)" + key + "=([^;]*)").exec(graph.getModel().getStyle(cell) || "");
  return m ? m[1] : null;
};

function setData(cell, fields) {
  const m = graph.getModel();
  m.beginUpdate();
  try {
    for (const [k, v] of Object.entries(fields)) {
      if ((val(cell, k) || "") !== (v == null ? "" : String(v))) graph.setAttributeForCell(cell, k, v == null ? "" : String(v));
    }
  } finally { m.endUpdate(); }
}
// The tag shown on the drawing, wherever that kind of item shows it:
//  - the P&ID library's instruments label themselves with a table, the letters over the
//    number (TI over ##): a new tag fills those cells (TI over 101), the layout stays;
//  - a box, a text, or a symbol whose label is drawn outside it: its label is the tag;
//  - any other library symbol: its label sits ON the symbol (empty, or part of the symbol -
//    the M of a motor, HEPA of a filter): the tag goes in a text of its own just above it,
//    the way tags are read (a text next to its item), and the symbol is left as drawn.
const TABLE = /<td[^>]*>[\s\S]*?<\/td>[\s\S]*?<td[^>]*>[\s\S]*?<\/td>/i;
const rawLabel = (cell) => cell.value && typeof cell.value === "object" ? cell.value.getAttribute("label") : cell.value;
const labelIsTag = (cell) => {
  const st = graph.getModel().getStyle(cell) || "";
  return !/(?:^|;)shape=mxgraph\./.test(st) || /verticalLabelPosition=(?:top|bottom)|labelPosition=(?:left|right)/.test(st);
};
// where an item's tag is shown: its tag text, its own label, its group's main shape - or null
function tagShownOn(cell) {
  const m = graph.getModel();
  const tc = val(cell, "tag_cell") && m.getCell(val(cell, "tag_cell"));
  if (tc) return tc;
  const shape = isGroup(cell) ? mainPart(cell) : cell;
  if (shape && TABLE.test(rawLabel(shape) || "")) return shape;
  if (shape && shape !== cell && labelIsTag(shape) && labelOf(shape)) return shape;
  return !isGroup(cell) && labelIsTag(cell) ? cell : null;  // a group's own label would sit over its parts
}
function showTag(cell, text) {
  const m = graph.getModel();
  const on = tagShownOn(cell);
  if (on && TABLE.test(rawLabel(on) || "")) {
    const esc = (x) => x.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const t = /^([A-Za-z]+)[\s\-_/]*(.*)$/.exec(text.trim());
    const parts = t ? [t[1], t[2]] : [text.trim(), ""];
    let k = 0;
    setLabel(on, rawLabel(on).replace(/(<td[^>]*>)([\s\S]*?)(<\/td>)/gi, (all, a, b, c) => k < 2 ? a + esc(parts[k++]) + c : all));
  } else if (on) {
    setLabel(on, text);
  } else if (text && cell.geometry) {  // a tag text of its own, just above the symbol
    const g = cell.geometry, w = Math.max(60, text.length * 8);
    const t = graph.insertVertex(m.getParent(cell), null, text, g.x + g.width / 2 - w / 2, g.y - 22, w, 20,
      "text;html=1;align=center;verticalAlign=middle;");
    setData(cell, { tag_cell: t.id });
  }
}
// A group (Ctrl+G, or "Group into one item"): one item drawn with several shapes. Its DEXPI
// details live on the group; its main shape - the biggest symbol in it - says what it is
// and shows its tag.
const isGroup = (cell) => /(?:^|;)group(?:;|$)/.test(graph.getModel().getStyle(cell) || "");
function mainPart(group) {
  const m = graph.getModel();
  const parts = [];
  const walk = (c) => { for (let i = 0; i < m.getChildCount(c); i++) { const k = m.getChildAt(c, i); if (m.isVertex(k)) { if (isGroup(k)) walk(k); else parts.push(k); } } };
  walk(group);
  const area = (c) => c.geometry ? c.geometry.width * c.geometry.height : 0;
  const shapes = parts.filter((c) => !/^text(;|$)/.test(m.getStyle(c) || ""));
  // the part that IS the item - not the biggest: a plain circle drawn round an instrument is
  // decoration. First one with details set by a person, then a P&ID library symbol or an
  // instrument's tag table, then size.
  const rank = (c) => [
    val(c, "dexpi_auto") === "0" || val(c, "tag_auto") === "0" ? 1 : 0,
    classOf(m.getStyle(c)) ? 1 : 0,
    TABLE.test(rawLabel(c) || "") ? 1 : 0,
    area(c)];
  const better = (a, b) => { const p = rank(a), q = rank(b); for (let i = 0; i < p.length; i++) if (p[i] !== q[i]) return q[i] - p[i]; return 0; };
  return (shapes.length ? shapes : parts).sort(better)[0] || null;
}
const DETAILS = ["dexpi_class", "dexpi_auto", "auto_class", "tag", "tag_auto", "tag_cell", "in_dexpi", "notes", "specs", "section"];
const moveDetails = (from, to) => {
  const f = {};
  for (const k of DETAILS) if (val(from, k) != null && val(to, k) == null) f[k] = val(from, k);
  if (Object.keys(f).length) setData(to, f);
};
// A shape dragged in from draw.io's libraries (or pasted) is typed the moment it lands: its
// DEXPI class from the shape, by the converter's own rules (mapping.shape_rules, mirrored
// here as map_shape(token, "", style)). Save refines it from the tag (a PSV tag: a safety
// valve; TIC: a controller). undefined: not a library shape - worked out on Save.
function classOf(style) {
  const R = schema && schema.shapes;
  const m = /(?:^|;)shape=([^;]+)/.exec(style || "");
  if (!R || !m) return undefined;
  const tok = m[1];
  if (tok in R.exact) return R.exact[tok];
  const body = () => {
    const vt = /(?:^|;)valveType=([A-Za-z]+)/.exec(style || "");
    return (vt && R.valve_types[vt[1]]) || R.valve_default;
  };
  if (tok === R.generic_valve) return body();
  const low = tok.toLowerCase();
  const rest = low.startsWith("mxgraph.pid2") ? low.slice(12) : low.startsWith("mxgraph.pid.") ? low.slice(12) : null;
  if (rest == null) return undefined;
  const dot = rest.indexOf("."), fam = dot < 0 ? rest : rest.slice(0, dot), name = dot < 0 ? "" : rest.slice(dot + 1);
  const word = (words) => { const w = words.find(([k]) => name.includes(k)); return w ? w[1] : null; };
  if (fam.startsWith("valves") || fam.startsWith("valve")) return word(R.valve_words) || body();
  if (R.instrument_families.some((f) => fam.startsWith(f))) return R.instrument_class;
  if (R.piping_families.includes(fam)) return word(R.piping_words) || R.piping_default;
  if (fam === "apparatus_elements") return null;
  for (const [fams, def, words] of R.equipment_families) {
    if (fams.includes(fam) || fams.some((f) => fam.startsWith(f))) return word(words) || def;
  }
  if (name.includes("column")) return "ProcessColumn";
  return undefined;
}
function typeNew(cell) {
  const m = graph.getModel();
  if (!m.isVertex(cell) || val(cell, "dexpi_class") != null || isGroup(cell)) return;
  const cls = classOf(m.getStyle(cell));
  if (cls === undefined) return;
  setData(cell, { dexpi_class: cls || schema.skip, auto_class: cls || schema.skip, dexpi_auto: "1",
                  in_dexpi: cls ? "1" : "0" });
}
function hookNewShapes() {

      el("div", { cls: "sub" }, (pic ? `${low.length} were only predicted by the model - it suggests more connections ` +
        `than a drawing has. ${sure.length} were traced along a drawn line.`
        : `${low.length} have an end guessed (a loose line end put on the nearest item). ${sure.length} are ` +
          "attached in the file.") + " How do you want to start? (Ctrl+Z undoes it.)"),
      button(`Check the ${low.length} uncertain ones one by one`, () => { guide.start = "check"; render(); }),
      twice(pic ? "Keep only the traced lines" : "Remove the guessed lines", low.length,
        () => { guide.start = "check"; graph.removeCells(low, false); render(); }),
      twice("Start with no lines and draw them myself", all.length,
        () => { guide.start = "check"; graph.removeCells(all, false); render(); }));
    return;
  }
  const q = queue();
  const cur = sel.length === 1 && m.isEdge(sel[0]) ? sel[0] : null;
  if (!cur) {
    if (openLow.length) {
      panel.append(el("div", { cls: "sub" }, `${openLow.length} uncertain connections to check.`),
        button("Next connection to check", () => focusCell(guideNext(q, null))));
    } else {
      panel.append(el("h3", {}, "Uncertain connections checked"),
        el("div", { cls: "sub" }, openSure.length ? `${openSure.length} sure ones (traced or attached) are left - usually right.`
          : "Every connection is checked. Save (Ctrl+S) to load it into the app."));
      if (openSure.length) panel.append(
        twice("Mark the sure ones checked", openSure.length, () => { for (const c of openSure) setData(c, { checked: "1" }); render(); }),
        button("Check them one by one too", () => { guide.sure = true; focusCell(guideNext(queue(), null)); }));
    }
    return;
  }
  const prob = val(cur, "prob"), conf = val(cur, "conf");
  panel.append(el("div", { cls: "prog" }, (q.includes(cur) ? `Connection ${q.indexOf(cur) + 1} of ${q.length} · ` : "") +
    `${q.filter((c) => !isChecked(c)).length} still to check` +
    (prob ? ` · model ${Math.round(parseFloat(prob) * 100)}% sure` : conf ? ` · ${conf}` : "") +
    (isChecked(cur) ? " · this one is checked" : "")));
  const act = el("div", { cls: "act" });
  const ok = button(isChecked(cur) ? "✓ Checked - next" : "✓ Keep - next", confirmCurrent, "Enter");
  ok.className = "ok";
  const no = button("✗ Remove", removeCurrent, "Delete");
  no.className = "no";
  act.append(ok, no, button("◂ Back", () => stepBy(-1)), button("Skip ▸", () => stepBy(1)));
  panel.append(act);
  renderLine(cur);
  const rest = q.filter((c) => !isChecked(c) && c !== cur);
  if (rest.length) {
    panel.append(el("details", {}, el("summary", {}, `All ${rest.length + 1} still to check at once`),
      twice("Keep all", rest.length + 1, () => { for (const c of [cur, ...rest]) setData(c, { checked: "1" }); graph.clearSelection(); render(); }),
      twice("Remove all", rest.length + 1, () => { graph.removeCells([cur, ...rest], false); render(); })));
  }
}

// ---------------------------------------------------------------------- panel ---
const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (k === "cls") n.className = v; else n[k] = v;
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
};
const field = (label, input, hint) => [el("label", { cls: "f" }, label), input, hint ? el("div", { cls: "hint" }, hint) : null]
  .filter((n) => n != null);

function render() {
  if (!panel) return;
  panel.innerHTML = "";
  if (!graph || !args) { panel.append(el("div", { cls: "sub" }, "Loading the editor...")); return; }
  panel.append(el("button", { textContent: document.fullscreenElement ? "⤡ Exit full screen (Esc)" : "⤢ Full screen",
    onclick: fullScreen, title: "The editor and this panel fill the screen",
    style: "float:right;margin:-6px -6px 6px 6px;padding:3px 8px;border:1px solid #c8ced6;border-radius:4px;background:#fff;cursor:pointer;font:inherit;font-size:12px" }));
  panel.append(guideBar());
  if (args.mode === "picture") { const sw = arrowSwitch(); if (sw) panel.append(sw); }
  if (guide) { renderGuide(); panel.append(foot()); setTimeout(dim, 0); return; }
  const sel = graph.getSelectionCells();
  const items = sel.filter((c) => graph.getModel().isVertex(c));
  if (items.length >= 2) { renderMerge(items); panel.append(foot()); return; }
  if (sel.length !== 1) {
    panel.append(el("h3", {}, sel.length ? `${sel.length} selected` : "DEXPI details"),
      el("div", { cls: "sub" }, "Select one item or line to set its DEXPI type, tag, line type, flow and specifications. " +
        "Select two or more items (Shift+click) to merge them."),
      el("div", { cls: "hint" }, (args.mode === "picture"
        ? "Move or resize a box to fit its symbol; for a missed symbol drag an item box from 'Lines and labels' " +
          "over it. Lines follow the pipes traced on the picture - drag a line's bend points to correct one. "
        : "Add items from the P&ID libraries on the left. ") + "Draw a line by dragging from a " +
        "shape's blue arrows onto another shape. A tag is a text next to its item; a pipe ending on a text " +
        "(\"Product\", \"N2\") is a stream entering or leaving the drawing."),
      args.sheet ? button("Sync all items from the spec sheet", () => syncSpecs("all"),
        `Saves, then puts ${args.sheet}'s values over the specifications of every item whose tag is in it`)
        : el("div", { cls: "hint" }, "Upload a spec sheet in the app's sidebar to fill specifications from it."));
    if (!sel.length) renderFinder();
    panel.append(foot());
    return;
  }
  const cell = sel[0];
  if (graph.getModel().isEdge(cell)) renderLine(cell); else renderItem(cell);
  panel.append(foot());
}
const foot = () => el("div", { cls: "foot" }, autosave
  ? (dirty ? "Changes not saved yet - saving in a moment ..." : "Saved: the app below has the drawing as it is.")
  : "Save (Ctrl+S) to load the drawing into the app below.");

// Find an item or a line: by tag or type, or by what still needs doing; a click shows it.
let findText = "", findWhat = "All";
function renderFinder() {
  const m = graph.getModel();
  const items = Object.values(m.cells).filter((c) => m.isVertex(c) && val(c, "dexpi_class") != null && !arrowHidden(c));
  const lines = Object.values(m.cells).filter((c) => m.isEdge(c) && !arrowHidden(c));
  const kinds = {
    "All": () => items,
    "Needs a look": () => items.filter((c) => val(c, "look") && !isChecked(c)),
    "Loose ends": () => lines.filter((c) => looseEnds(c) > 0),
    "Left out": () => items.filter((c) => val(c, "in_dexpi") === "0" || effClass(c) === (schema && schema.skip)),
    "Unknown flow": () => lines.filter((c) => val(c, "flow_unknown") === "1" && styleOf(c, "endArrow") === "none"
                                       && (styleOf(c, "startArrow") == null || styleOf(c, "startArrow") === "none")),
  };
  const box = el("details", { open: true }, el("summary", {}, "Find"));
  const seg = el("div", { cls: "seg", style: "margin:6px 0" });
  for (const k of Object.keys(kinds)) {
    seg.append(el("button", { cls: findWhat === k ? "on" : "", textContent: `${k} (${kinds[k]().length})`,
      style: "font-size:11px", onclick: () => { findWhat = k; render(); marks(); } }));
  }
  const q = el("input", { type: "text", placeholder: "Tag or type, e.g. PSV, V201, Pump", value: findText,
    oninput: (e) => { findText = e.target.value; list(); } });
  const out = el("div", { style: "max-height:260px;overflow-y:auto;margin-top:6px" });
  const name = (c) => m.isEdge(c) ? `${itemName(m.getTerminal(c, true))} – ${itemName(m.getTerminal(c, false))}` : itemName(c);
  function list() {
    out.innerHTML = "";
    const t = findText.trim().toLowerCase();
    const hits = kinds[findWhat]().filter((c) => !t || `${name(c)} ${effClass(c) || ""}`.toLowerCase().includes(t));
    for (const c of hits.slice(0, 60)) {
      out.append(el("div", { style: "padding:3px 4px;border-bottom:1px solid #eef0f3;cursor:pointer",
        onclick: () => focusCell(c), title: val(c, "look") || val(c, "why") || "" },
        el("b", {}, name(c)), el("span", { cls: "hint", style: "margin-left:6px" },
          m.isEdge(c) ? "line" : (effClass(c) || "") + (val(c, "look") && !isChecked(c) ? " · needs a look" : ""))));
    }
    if (hits.length > 60) out.append(el("div", { cls: "hint" }, `... ${hits.length - 60} more - type to narrow`));
    if (!hits.length) out.append(el("div", { cls: "hint" }, "Nothing."));
  }
  list();
  const opts = el("div", { style: "margin-top:8px" },
    el("label", { cls: "check" }, el("input", { type: "checkbox", checked: showFlags,
      onchange: (e) => { showFlags = e.target.checked; marks(); } }),
      "Flags: ! needs a look (with 'Unknown flow' picked: a grey arrow on those pipes)"),
    el("label", { cls: "check" }, el("input", { type: "checkbox", checked: autosave,
      onchange: (e) => { autosave = e.target.checked; render(); } }), "Save automatically"));
  box.append(seg, q, out, opts);
  panel.append(box);
}

function itemName(cell) {
  if (!cell) return "(loose end)";
  return val(cell, "tag") || labelOf(tagShownOn(cell)) || "(no tag)";
}

function renderItem(cell) {
  const isText = /^text(;|$)/.test(graph.getModel().getStyle(cell) || "");
  const known = val(cell, "dexpi_class") != null;
  const owners = isText ? itemsWithLabel(cell) : [];
  if (owners.length) {
    panel.append(el("h3", {}, labelOf(cell) || "Tag label"),
      el("div", { cls: "sub" }, `The tag label of ${itemName(owners[0])} (${effClass(owners[0]) || "item"}). ` +
        "Edit the text (double-click) to change its tag; move or resize it freely."),
      button("Select its item", () => graph.setSelectionCell(owners[0])));
    return;
  }
  if (isText && !known) {
    panel.append(el("h3", {}, labelOf(cell) || "Text"),
      el("div", { cls: "sub" }, "A text. Next to an item it is read as the item's tag. At the end of a line it is " +
        "a stream entering or leaving the drawing (DEXPI off-page connector)."));
    return;
  }
  const auto = val(cell, "auto_class");
  const isAuto = val(cell, "dexpi_auto") !== "0";
  panel.append(el("h3", {}, itemName(cell)),
    el("div", { cls: "sub" }, known ? (isAuto ? `${auto} (${args.mode === "picture" ? "found by the model" : "from the shape"})`
                                             : `${val(cell, "dexpi_class")} (set by you)`)
                                    : "New - its DEXPI type is worked out when you Save"));
  if (val(cell, "look") && !isChecked(cell)) {
    panel.append(el("div", { cls: "hint", style: "color:#b35c00;margin-bottom:6px" }, "Needs a look: " + val(cell, "look")));
  }
  if (val(cell, "why")) panel.append(el("div", { cls: "hint" }, "Found: " + val(cell, "why")));

  const tag = el("input", { type: "text", value: val(cell, "tag") || labelOf(tagShownOn(cell)) || "", onchange: (e) => {
    const text = e.target.value.trim();
    const m = graph.getModel();
    m.beginUpdate();
    try {
      setData(cell, { tag: text, tag_auto: "0" });
      showTag(cell, text);
    } finally { m.endUpdate(); }
  } });
  panel.append(...field("Tag", tag, "Also changes the tag shown on the drawing."));
  let near = [];
  try { near = JSON.parse(val(cell, "ocr_near") || "[]"); } catch (err) { near = []; }
  if (near.length) {   // text the OCR read nearby that no item claimed - often this one's tag
    const row = el("div", { style: "display:flex;flex-wrap:wrap;gap:4px;margin-top:4px" },
      el("span", { cls: "hint", style: "margin:0 4px 0 0" }, "Read nearby:"));
    for (const t of near) row.append(el("button", { textContent: t, title: "Use as its tag",
      style: "padding:1px 6px;border:1px solid #c8ced6;border-radius:10px;background:#fff;cursor:pointer;font-size:12px",
      onclick: () => { setData(cell, { tag: t, tag_auto: "0" }); showTag(cell, t); render(); } }));
    panel.append(row);
  }
  if (!tagLabelOf(cell) && cell.geometry) {
    panel.append(button("Add a tag label", () => addTagLabel(cell),
      "A text next to the item showing its tag - move and resize it on its own; edit it there or here"));
  } else if (tagLabelOf(cell)) {
    panel.append(el("div", { cls: "hint" }, "Its tag label moves with it; drag the label alone to place it."));
  }

  const choices = (schema && schema.choices) || [];
  const type = el("select", { onchange: (e) => {
    if (e.target.value === "") setData(cell, { dexpi_auto: "1" });
    else setData(cell, Object.assign({ dexpi_class: e.target.value, dexpi_auto: "0", in_dexpi: e.target.value === schema.skip ? "0" : "1" },
                                     isArrow(cell) && e.target.value !== schema.skip ? { arrow: "0" } : {}));
  } });
  // the type worked out for it (from its shape, or the model's), named - not just "automatic"
  const from = args.mode === "picture" && classOf(graph.getModel().getStyle(cell)) === undefined
    ? "found by the model" : "from the shape";
  type.append(el("option", { value: "", textContent: auto ? `${auto} (${from})` : "Worked out when you Save" }));
  for (const c of choices) type.append(el("option", { value: c, textContent: c }));
  type.value = isAuto ? "" : (val(cell, "dexpi_class") || "");
  panel.append(...field("DEXPI type", type));

  // a stream (off-page connector): in or out is the flow on its pipe - set it here
  if (effClass(cell) === (schema && schema.off_page)) {
    const m = graph.getModel();
    // its pipes: lines attached to it, and lines only drawn up to it (joined by the app: stream_lines)
    const side = new Map(m.getEdges(cell).filter((e) => styleOf(e, "dashed") != 1)
      .map((e) => [e, m.getTerminal(e, true) === cell ? "source" : "target"]));
    try {
      for (const [id, end] of JSON.parse(val(cell, "stream_lines") || "[]")) {
        const e = m.getCell(id);
        if (e && !side.has(e)) side.set(e, end);
      }
    } catch (err) { /* none */ }
    const pipes = [...side.keys()];
    const away = (e) => {   // does the arrowhead point away from the stream?
      const toB = styleOf(e, "endArrow") !== "none", toA = styleOf(e, "startArrow") != null && styleOf(e, "startArrow") !== "none";
      const fromHere = side.get(e) === "source";
      return toB === toA ? null : fromHere ? toB : toA;
    };
    const set = (out) => { m.beginUpdate(); try { for (const e of pipes) {
      const fromHere = side.get(e) === "source";
      setStyle(e, fromHere !== out ? { endArrow: "classic", startArrow: "none" } : { endArrow: "none", startArrow: "classic" });
    } } finally { m.endUpdate(); } render(); };
    if (pipes.length) {
      const ways = pipes.map(away), isIn = ways.every((w) => w === true), isOut = ways.every((w) => w === false);
      const seg = el("div", { cls: "seg" });
      for (const [text, on, out] of [["In (feed)", isIn, false], ["Out (product)", isOut, true]]) {
        seg.append(el("button", { cls: on ? "on" : "", textContent: text, onclick: () => set(out) }));
      }
      panel.append(...field("Stream", seg, (isIn || isOut ? "" : "Not known yet - pick one. ") +
        "Sets the arrow on its pipe: away from it (in) or towards it (out); DEXPI FlowIn/FlowOut connector."));
    } else {
      panel.append(el("div", { cls: "hint" }, "A stream needs its pipe: draw a line from it to an item."));
    }
  }
  connections(cell);
  inDexpi(cell);
  notes(cell);
  if (val(cell, "section")) panel.append(...field("Plant section", el("div", {}, val(cell, "section"))));
  const cls = isAuto ? auto : val(cell, "dexpi_class");
  specs(cell, cls && schema && schema.classes[cls] ? cls : null);
  if (args.sheet) panel.append(button("Fill from the spec sheet", () => syncSpecs([cell.id]),
    `Saves, then puts ${args.sheet}'s values for this tag over its specifications`));
  tools(cell);
}

// What flows into and out of an item: its lines (on it or on its parts), by the arrowheads
// drawn on them - in, out, both ways, or not known yet. A click selects the line.
function connections(cell) {
  const m = graph.getModel();
  const own = new Set();
  const walk = (c) => { own.add(c); for (let i = 0; i < m.getChildCount(c); i++) walk(m.getChildAt(c, i)); };
  walk(cell);
  const lines = new Set();
  for (const c of own) for (const e of m.getEdges(c)) lines.add(e);
  const groups = { "Inbound": [], "Outbound": [], "Both ways": [], "Direction not known": [], "Signal lines": [] };
  for (const e of lines) {
    const src = m.getTerminal(e, true), dst = m.getTerminal(e, false);
    const here = own.has(src), there = here ? dst : src;
    if (here && own.has(dst)) continue;   // a line inside the item itself
    const toEnd = styleOf(e, "endArrow") !== "none";   // draw.io's default is an arrowhead at the end
    const toStart = styleOf(e, "startArrow") != null && styleOf(e, "startArrow") !== "none";
    const up = val(e, "upstream");   // the app's direction when none is drawn (implied by other arrows)
    const g = toEnd && toStart ? "Both ways"
      : toEnd || toStart ? (toEnd === here ? "Outbound" : "Inbound")
      : up && [...own].some((c) => c.id === up) ? "Outbound" : up && there && there.id === up ? "Inbound"
      : styleOf(e, "dashed") == 1 ? "Signal lines" : "Direction not known";
    groups[g].push([e, there]);
  }
  const n = Object.values(groups).reduce((a, l) => a + l.length, 0);
  const box = el("details", n ? { open: true } : {}, el("summary", {}, `Connections (${n})`));
  if (!n) box.append(el("div", { cls: "hint" }, "No lines on it yet: draw one from it to another item."));
  for (const [title, list] of Object.entries(groups)) {
    if (!list.length) continue;
    box.append(el("label", { cls: "f" }, `${title} (${list.length})`));
    for (const [e, other] of list) {
      const signal = styleOf(e, "dashed") == 1;
      const what = other ? `${itemName(other)}${effClass(other) ? " · " + effClass(other) : ""}` : "(loose end)";
      box.append(el("div", { style: "display:flex;justify-content:space-between;gap:6px;padding:2px 0;cursor:pointer",
        title: "Select this line", onclick: () => graph.setSelectionCell(e) },
        el("span", {}, (title === "Inbound" ? "← " : title === "Outbound" ? "→ " : title === "Signal lines" ? "┄ " : "↔ ") + what),
        el("span", { cls: "hint", style: "margin:0" }, (signal ? "signal" : "pipe") + (val(e, "in_dexpi") === "0" ? ", left out" : ""))));
    }
  }
  if (groups["Direction not known"].length) box.append(el("div", { cls: "hint" },
    "Select a line and set its flow to sort it into inbound or outbound."));
  panel.append(box);
}

// ---------------------------------------------------------------- item tools ---
// The side panel's Connect tools, here: streams, taking an in-line item out, merging.
const effClass = (c) => val(c, "dexpi_auto") !== "0" ? val(c, "auto_class") : val(c, "dexpi_class");
const button = (text, act, title) => el("button", { textContent: text, onclick: act, title: title || "",
  style: "width:100%;margin-top:6px;padding:6px;border:1px solid #c8ced6;border-radius:4px;background:#fff;cursor:pointer;font:inherit" });

function tools(cell) {
  const m = graph.getModel();
  const box = el("details", { open: false }, el("summary", {}, "Streams and other tools"));
  const name = el("input", { type: "text", placeholder: "Name, e.g. Product, N2, Vent" });
  box.append(...field("New stream", name),
    el("div", { cls: "row" },
      button("Add feed (in)", () => addStream(cell, false, name.value.trim() || "Feed"), "A pipe entering the drawing here"),
      button("Add product (out)", () => addStream(cell, true, name.value.trim() || "Product"), "A pipe leaving the drawing here")));
  const lines = m.getEdges(cell).filter((e) => m.getTerminal(e, true) && m.getTerminal(e, false));
  const others = [...new Set(lines.map((e) => m.getTerminal(e, true) === cell ? m.getTerminal(e, false) : m.getTerminal(e, true)))];
  if (lines.length === 2 && others.length === 2 && !others.includes(cell)) {
    box.append(button(`Take it out: join ${itemName(others[0])} – ${itemName(others[1])}`, () => takeOut(cell, lines, others),
      "Removes this item and its two lines, and draws one line between its neighbours"));
  }
  panel.append(box);
}

function addStream(cell, out, name) {
  const m = graph.getModel(), g = cell.geometry;
  if (!g) return;
  const w = Math.max(60, 0.6 * g.width), h = w / 2, gap = Math.max(40, 0.5 * Math.max(g.width, g.height));
  // beside the item (outlets right, inlets left), below any stream already there
  const x = out ? g.x + g.width + gap : g.x - gap - w;
  let y = g.y + g.height / 2 - h / 2;
  const taken = m.getEdges(cell).map((e) => m.getTerminal(e, true) === cell ? m.getTerminal(e, false) : m.getTerminal(e, true))
    .filter((o) => o && o.geometry && Math.abs(o.geometry.x - x) < w);
  y += taken.length * 1.6 * h;
  const parent = m.getParent(cell);
  m.beginUpdate();
  try {
    const v = graph.insertVertex(parent, null, name, x, y, w, h,
      "text;html=1;align=center;verticalAlign=middle;strokeColor=#000000;");
    setData(v, { dexpi_class: schema.off_page, dexpi_auto: "0", tag: name, tag_auto: "0", in_dexpi: "1" });
    const style = "edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;";
    graph.insertEdge(parent, null, "", out ? cell : v, out ? v : cell, style);
    graph.setSelectionCell(v);
  } finally { m.endUpdate(); }
}

function takeOut(cell, lines, others) {
  const m = graph.getModel();
  // keep the direction: the neighbour whose line flows into this item comes first
  const into = lines.find((e) => m.getTerminal(e, false) === cell && styleOf(e, "endArrow") !== "none");
  const first = into ? m.getTerminal(into, true) : others[0];
  const second = others.find((o) => o !== first);
  const arrow = lines.some((e) => styleOf(e, "endArrow") !== "none" || (styleOf(e, "startArrow") || "none") !== "none");
  m.beginUpdate();
  try {
    graph.removeCells([...lines, cell], false);
    graph.insertEdge(m.getParent(first), null, "", first, second,
      `edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=${arrow ? "classic" : "none"};` +
      (styleOf(lines[0], "dashed") == 1 ? "dashed=1;" : ""));
  } finally { m.endUpdate(); }
}

// `o` is folded into `keep`: its lines move to `keep` - attached ones, and lines that only end
// next to it (draw.io lets a line end loose; the converter would otherwise join it to whatever
// is nearest once `o` is gone) - and its own tag text goes with it.
function absorb(keep, o) {
  const m = graph.getModel();
  for (const e of m.getEdges(o)) {
    if (m.getTerminal(e, true) === o) m.setTerminal(e, keep, true);
    if (m.getTerminal(e, false) === o) m.setTerminal(e, keep, false);
  }
  const g = o.geometry, pad = 15;
  if (g) {
    for (const e of Object.values(m.cells)) {
      if (!m.isEdge(e) || !e.geometry) continue;
      for (const src of [true, false]) {
        if (m.getTerminal(e, src)) continue;
        const pt = e.geometry.getTerminalPoint(src);
        if (pt && pt.x >= g.x - pad && pt.x <= g.x + g.width + pad && pt.y >= g.y - pad && pt.y <= g.y + g.height + pad) {
          m.setTerminal(e, keep, src);
        }
      }
    }
  }
  const tc = val(o, "tag_cell") && m.getCell(val(o, "tag_cell"));
  if (tc && tc !== keep) graph.removeCells([tc], false);
}

function renderMerge(items) {
  panel.append(el("h3", {}, `${items.length} items selected`),
    el("div", { cls: "sub" }, "Duplicates of one item (two boxes on one symbol)? Merge them: their lines move " +
      "to the one you keep, a missing tag, type or specifications are taken from the others. The kept one " +
      "keeps its own box - keep the tight one."));
  const keep = el("select", {});
  items.forEach((c, i) => keep.append(el("option", { value: String(i), textContent: `${itemName(c)} (${effClass(c) || "new"})` })));
  const cover = el("input", { type: "checkbox" });
  panel.append(...field("Keep", keep));
  if (args.mode === "picture") panel.append(el("label", { cls: "check" }, cover, "Grow its box to cover all of them"));
  panel.append(button("Merge into it", () => {
    const k = items[Number(keep.value)];
    mergeItems(k, items.filter((c) => c !== k), cover.checked);
  }));
  {
    panel.append(el("div", { cls: "sub" }, "Or several shapes drawing ONE piece of equipment (a symbol with extra " +
      "shapes added)? Group them: they stay as drawn and are one DEXPI item - the biggest symbol says what it is. " +
      "Ungroup (Ctrl+Shift+U) splits them again."),
      button("Group into one item", () => graph.setSelectionCell(graph.groupCells(null, 0, items))));
  }
}

function mergeItems(keep, others, cover) {
  const m = graph.getModel();
  m.beginUpdate();
  try {
    for (const o of others) {
      const otherTag = val(o, "tag") || labelOf(o);
      if (!(val(keep, "tag") || labelOf(tagShownOn(keep))) && otherTag) { setData(keep, { tag: otherTag, tag_auto: "0" }); showTag(keep, otherTag); }
      const kc = effClass(keep), oc = effClass(o);
      if ((!kc || kc === schema.skip) && oc && oc !== schema.skip) setData(keep, { dexpi_class: oc, dexpi_auto: "0" });
      let ks = {}, os = {};
      try { ks = JSON.parse(val(keep, "specs") || "{}"); os = JSON.parse(val(o, "specs") || "{}"); } catch (err) { /* keep */ }
      for (const part of ["dexpi", "custom"]) if (os[part]) ks[part] = Object.assign({}, os[part], ks[part] || {});
      if (Object.keys(ks).length) setData(keep, { specs: JSON.stringify(ks) });
      if (cover && args.mode === "picture" && keep.geometry && o.geometry) {  // the box covers both
        const a = keep.geometry, b = o.geometry, g = a.clone();
        g.x = Math.min(a.x, b.x); g.y = Math.min(a.y, b.y);
        g.width = Math.max(a.x + a.width, b.x + b.width) - g.x; g.height = Math.max(a.y + a.height, b.y + b.height) - g.y;
        m.setGeometry(keep, g);
      }
      absorb(keep, o);
    }
    // lines that now join the kept item to itself, or repeat another of its lines, go
    const seen = new Set(), drop = [];
    for (const e of m.getEdges(keep)) {
      const a = m.getTerminal(e, true), b = m.getTerminal(e, false);
      if (a === b) { drop.push(e); continue; }
      const key = [a && a.id, b && b.id].sort().join("|") + "|" + (styleOf(e, "dashed") || "0");
      if (seen.has(key)) drop.push(e); else seen.add(key);
    }
    if (drop.length) graph.removeCells(drop, false);
    graph.removeCells(others, false);
    graph.setSelectionCell(keep);
  } finally { m.endUpdate(); }
}

function lineKind(cell) {
  const m = graph.getModel();
  const cls = (t) => t ? (val(t, "dexpi_auto") !== "0" ? val(t, "auto_class") : val(t, "dexpi_class")) : null;
  const ends = [m.getTerminal(cell, true), m.getTerminal(cell, false)].map(cls);
  const inst = ends.filter((c) => schema.instruments.includes(c)).length;
  const signal = styleOf(cell, "dashed") == 1;
  if (inst === 2) return ["Signal line", "SignalLineFunction"];
  if (inst && signal && ends.some((c) => schema.valves.includes(c))) return ["Signal line", "SignalLineFunction"];
  if (inst) return ["Measuring line", "MeasuringLineFunction"];
  return ["Pipe", "PipingNetworkSegment"];
}

function renderLine(cell) {
  const m = graph.getModel();
  const a = m.getTerminal(cell, true), b = m.getTerminal(cell, false);
  const [kind, cls] = schema && schema.instruments ? lineKind(cell) : ["Line", null];
  panel.append(el("h3", {}, `${itemName(a)} – ${itemName(b)}`), el("div", { cls: "sub" }, `${kind} in DEXPI`));
  if (val(cell, "why")) panel.append(el("div", { cls: "hint" }, "Found: " + val(cell, "why")));
  if (!a || !b) panel.append(el("div", { cls: "hint", style: "color:#b35c00;margin-bottom:6px" },
    "Not attached at one end. Near a symbol the end is guessed onto it; in open space it becomes an " +
    "inlet / outlet of the drawing. To connect it, drag the end onto the symbol (or onto a pipe, for a branch) " +
    "until it is outlined in blue."));

  const dashed = styleOf(cell, "dashed") == 1;
  const seg = (opts, on) => {
    const s = el("div", { cls: "seg" });
    for (const [text, isOn, act] of opts) s.append(el("button", { cls: isOn ? "on" : "", textContent: text, onclick: act }));
    return s;
  };
  panel.append(...field("Line", seg([
    ["Process pipe", !dashed, () => setStyle(cell, { dashed: "0" })],
    ["Signal line", dashed, () => setStyle(cell, { dashed: "1" })],
  ]), "Signal lines are drawn dashed."));

  const endA = styleOf(cell, "endArrow"), startA = styleOf(cell, "startArrow");
  const toB = endA !== "none", toA = startA != null && startA !== "none";  // no endArrow = draw.io's default arrow
  panel.append(...field("Flow", seg([
    [`→ ${itemName(b)}`, toB && !toA, () => setStyle(cell, { endArrow: "classic", startArrow: "none" })],
    [`→ ${itemName(a)}`, toA && !toB, () => setStyle(cell, { endArrow: "none", startArrow: "classic" })],
    ["Both", toA && toB, () => setStyle(cell, { endArrow: "classic", startArrow: "classic" })],
    ["None", !toA && !toB, () => setStyle(cell, { endArrow: "none", startArrow: "none" })],
  ]), "The arrowhead on the drawing. Both: a two-way pipe (DEXPI dual flow)."));

  inDexpi(cell);
  notes(cell);
  specs(cell, cls && schema && schema.classes[cls] ? cls : null);
}

function inDexpi(cell) {
  const box = el("input", { type: "checkbox", checked: val(cell, "in_dexpi") !== "0",
                            onchange: (e) => setData(cell, { in_dexpi: e.target.checked ? "1" : "0" }) });
  panel.append(el("label", { cls: "check" }, box, "In DEXPI"));
}

function notes(cell) {
  panel.append(...field("Notes", el("input", { type: "text", value: val(cell, "notes") || "",
    onchange: (e) => setData(cell, { notes: e.target.value }) })));
}

function specs(cell, cls) {
  if (!cls) return;
  const fields = schema.classes[cls];
  if (!fields.length) return;
  let data = {};
  try { data = JSON.parse(val(cell, "specs") || "{}"); } catch (err) { data = {}; }
  const filled = fields.filter((f) => ((data[f.custom ? "custom" : "dexpi"] || {})[f.name])).length;
  const box = el("details", {}, el("summary", {}, `Specifications ${filled}/${fields.length}`));
  const write = (f, v) => {
    const part = f.custom ? "custom" : "dexpi";
    data[part] = data[part] || {};
    if (v == null || v === "") delete data[part][f.name]; else data[part][f.name] = v;
    if (!Object.keys(data[part]).length) delete data[part];
    setData(cell, { specs: Object.keys(data).length ? JSON.stringify(data) : "" });
  };
  for (const f of fields) {
    const cur = (data[f.custom ? "custom" : "dexpi"] || {})[f.name];
    const label = f.label + (f.custom ? " (custom)" : "");
    if (f.kind === "quantity") {
      const num = el("input", { type: "number", step: "any", value: cur && cur.value != null ? cur.value : "" });
      const unit = el("select", {});
      for (const u of f.units) unit.append(el("option", { value: u, textContent: u }));
      unit.value = (cur && cur.unit) || f.units[0];
      const upd = () => write(f, num.value === "" ? null : { value: parseFloat(num.value), unit: unit.value });
      num.addEventListener("change", upd); unit.addEventListener("change", upd);
      box.append(...field(label, el("div", { cls: "row" }, num, unit)));
    } else if (f.kind === "choice") {
      const s = el("select", { onchange: (e) => write(f, e.target.value || null) });
      s.append(el("option", { value: "", textContent: "" }));
      for (const o of f.options) s.append(el("option", { value: o, textContent: o }));
      s.value = cur || "";
      box.append(...field(label, s));
    } else {
      box.append(...field(label, el("input", { type: f.kind === "number" ? "number" : "text", value: cur != null ? cur : "",
        onchange: (e) => write(f, e.target.value === "" ? null : (f.kind === "number" ? parseFloat(e.target.value) : e.target.value)) })));
    }
  }
  panel.append(box);
}
</script>
</body>
</html>
